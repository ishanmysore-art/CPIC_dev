
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cpic"
version = "0.1.0"
description = "Compressed Predictive Information Coding"
readme = "README.md"
requires-python = ">=3.6"
authors = [
    { name = "Rui Meng", email = "mengrui6351@gmail.com" }
]
maintainers = [
    { name = "Kailin Zhuang", email = "kailin.zhuang@berkeley.edu" },
    { name = "Phoenix Pham", email = "phoenixpham@berkeley.edu" },
    { name = "Aditya Anantaraman", email = "aditya.anant@berkeley.edu"}
]
license = { file = "LICENSE.txt" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]
dependencies = [
  "numpy>=1.19.5,<1.24",
  "scipy",
  "h5py",
  "pandas",
  "scikit-learn",
  "matplotlib",
  "torch",
  "torchvision",
  "tensorboardX",
  "DynamicalComponentsAnalysis",
  "tqdm",
  "sdepy",
]

[project.urls]
Homepage = "https://github.com/BouchardLab/CPIC_dev"

[tool.hatch.build.targets.wheel]
packages = ["src/cpic"]
