
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "CPIC"
version = "0.1.0"
description = "Compressed Predictive Information Coding"
readme = "README.md"
requires-python = ">=3.6"
authors = [
    { name = "Rui Meng", email = "mengrui6351@gmail.com" }
]
maintainers = [
    { name = "Kailin Zhuang", email = "kailin.zhuang@berkeley.edu" },
    { name = "Phoenix Pham", email = "phoenixpham@berkeley.edu" },
    { name = "Aditya Anantaraman", email = "aditya.anant@berkeley.edu"}
]
license = { file = "LICENSE.txt" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/BouchardLab/CPIC_dev"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
