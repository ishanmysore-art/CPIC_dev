[Paths]
# Local-only helper: regenerate the probe-result figures (position-orbit overlay +
# true-vs-predicted velocity field) without re-running a full sweep. Own output dir
# so it never collides with other runs. NOT part of the NERSC sweep.
output_dir = ./experiments/particle_experiment/res/probe_figs
csv_name = particle_probe_figs_runs.csv
plot_name = R2_vs_num_noise_probe_figs.png

[Data]
t_max = 2000
train_ratio = 0.7
T = 31
num_blob = 30
orbit_radius = 3.0
trajectory = circle
omega = 0.05
sigma_blob = 0.1
noise_ar_coeff = 0.8
spatial_bounds = 10.0

[Sweep]
# One seed. Both FeatureMaskMLP AND ConvPhysical, each in (L) and (O) via the
# runner's spec expansion -> 4 encoder-space specs = 4 probe figures.
seeds = 0
num_noise_values = 80
include_mlp = false
include_conv_spatial = false
include_conv_particle = false
include_mask_uniform_static = false
include_mask_uniform_learned = true
include_mask_pi_static = false
include_mask_pi_init_learned = false
include_conv_physical = true

[Model]
hidden_dim = 64
beta = 1e-3
critic = concat
estimator_compress = infonce_upper
# Ungated compression rate bounds the FeatureMaskMLP gate (no-op for gate-free encoders).
compress_ungated = true
n_layers = 1
activation = relu
# ConvPhysical grid (runner defaults, made explicit here). The 20x20 rasterization is
# the CPU bottleneck of this run; drop to 12-16 if you only need illustrative figures.
conv_physical_grid_size = 20
conv_physical_spatial_bounds = 3.0
conv_physical_kernel_size = 3
conv_physical_stride = 1
conv_physical_padding = 1

[Training]
# Full 1000ep to match the sweep-trained models (figure fidelity). Drop to ~500 if
# you just want quick illustrative figures.
epochs = 1000
batch_size = 256
lr = 2e-4
early_stop = 1000000
conv_epochs = 1000
conv_early_stop = 1000000

[OOM]
oom_retry_enabled = true
oom_batch_size_fallbacks = 256,128,64,32
oom_max_retries = 4
oom_skip_on_failure = true

[Analysis]
save_filter_viz = false
save_probe_viz = true
# TB off locally — this run is only for the probe figures.
enable_tensorboard = false
mask_eval_threshold = 0.6
pi_max_lag = 5
pi_lag_agg = mean
probe_eval_every = 0

[Compute]
use_gpu = false
device = cpu
