[Paths]
output_dir = ./experiments/particle_experiment/res/ellipse
csv_name = particle_ellipse_runs.csv
plot_name = R2_vs_num_noise_ellipse.png

[Data]
t_max = 2000
train_ratio = 0.7
T = 31
num_blob = 30
orbit_radius = 3.0
trajectory = ellipse
semi_major = 2.5
semi_minor = 1.5
omega = 0.05
sigma_blob = 0.1
noise_ar_coeff = 0.8
spatial_bounds = 10.0

[Sweep]
seeds = 0,1,2,3,4
num_noise_values = 0,20,50,80,120,180
include_mlp = true
include_conv_spatial = false
include_conv_particle = false
include_mask_uniform_static = true
include_mask_uniform_learned = true
include_mask_pi_static = false
include_mask_pi_init_learned = false
include_conv_physical = true

[Model]
hidden_dim = 64
beta = 1e-3
critic = concat
n_layers = 1
activation = relu
conv_spatial_kernel_size = 4
conv_spatial_stride = 1
conv_spatial_padding = 1
conv_particle_kernel_size = 5
conv_particle_stride = 1
conv_particle_padding = 2
conv_particle_coord_kernel_size = 2
conv_physical_grid_size = 20
conv_physical_spatial_bounds = 3.0
conv_physical_kernel_size = 3
conv_physical_stride = 1
conv_physical_padding = 1

[Training]
epochs = 200
batch_size = 256
lr = 2e-4
early_stop = 50
# Conv encoders converge fast and are the runtime bottleneck; give them a
# smaller budget than the MaskMLP discovery recipe (200) needs.
conv_epochs = 80
conv_early_stop = 25

[OOM]
oom_retry_enabled = true
oom_batch_size_fallbacks = 256,128,64,32
oom_max_retries = 4
oom_skip_on_failure = true

[Analysis]
save_filter_viz = false
filter_layer_idx = 0
filter_out_dir = filters
enable_tensorboard = false
tensorboard_dir = tensorboard
mask_eval_threshold = 0.6
pi_max_lag = 5
pi_lag_agg = mean

[Compute]
use_gpu = true
device = auto
