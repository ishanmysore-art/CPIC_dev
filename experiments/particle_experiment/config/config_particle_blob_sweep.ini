[Paths]
output_dir = ./experiments/particle_experiment/res/blob_sweep
csv_name = particle_blob_sweep_runs.csv
plot_name = R2_vs_num_noise_blob_sweep.png

[Data]
t_max = 2000
train_ratio = 0.7
T = 31
# Fallback num_blob when num_blob_values is absent; the [Sweep] list below overrides.
num_blob = 30
orbit_radius = 3.0
trajectory = circle
omega = 0.05
sigma_blob = 0.1
noise_ar_coeff = 0.8
spatial_bounds = 10.0

[Sweep]
# BLOB-axis sweep. Fixed num_noise=80, sweep the number
# of coherent-orbit blob particles. The runner emits the three latent-quality R2
# families (position / velocity / noise) vs num_blob via plot_r2_families_vs_sweep,
# written to R2_families_vs_num_blob.png. Full 3 encoders x latent/obs, 3 seeds.
# num_blob=0 is the no-blob control end (position/velocity R2 should floor); higher
# num_blob = stronger coherent signal.
seeds = 0, 1, 2
num_noise_values = 80
num_blob_values = 0, 10, 20, 30, 50
include_mlp = true
include_conv_spatial = false
include_conv_particle = false
include_mask_uniform_static = false
include_mask_uniform_learned = true
include_mask_pi_static = false
include_mask_pi_init_learned = false
include_conv_physical = true

[Model]
hidden_dim = 64
# Soft-penalty compression weight: loss = beta*I_compress - beta1*I_predictive.
beta = 1e-3
critic = concat
# Rate estimator: infonce_upper (UPPER bound on the minimized rate I(X;Z)). Off-diagonal
# domination is handled by more InfoNCE samples (larger batch below). A clean
# "vary the data, hold the model" baseline for the metric-vs-num_blob panels.
estimator_compress = infonce_upper
n_layers = 1
activation = relu
conv_spatial_kernel_size = 4
conv_spatial_stride = 1
conv_spatial_padding = 1
conv_particle_kernel_size = 5
conv_particle_stride = 1
conv_particle_padding = 2
conv_particle_coord_kernel_size = 2
conv_physical_grid_size = 20
conv_physical_spatial_bounds = 3.0
conv_physical_kernel_size = 3
conv_physical_stride = 1
conv_physical_padding = 1

[Training]
epochs = 1000
# Larger batch = more InfoNCE negatives (Rui's off-diagonal fix).
batch_size = 1024
lr = 2e-4
early_stop = 1000000
conv_epochs = 1000
conv_early_stop = 1000000

[OOM]
oom_retry_enabled = true
oom_batch_size_fallbacks = 1024,512,256,128
oom_max_retries = 4
oom_skip_on_failure = true

[Analysis]
save_filter_viz = false
save_probe_viz = false
enable_tensorboard = true
tensorboard_dir = tensorboard
mask_eval_threshold = 0.6
pi_max_lag = 5
pi_lag_agg = mean
probe_eval_every = 25

[Compute]
use_gpu = true
device = auto
