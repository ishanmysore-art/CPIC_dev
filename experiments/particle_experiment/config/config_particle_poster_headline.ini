[Paths]
# POSTER HEADLINE (2026-07-21): 3-encoder latent-space comparison on the soft-penalty
# objective with rate WARM-UP applied uniformly to all encoders. Produces: (a) the
# rate/prediction curve (final_I_predictive vs final_I_compress across beta), (b)
# latent-vs-obs probe R2 for MLP / ConvPhysical / FeatureMaskMLP, (c) the ConvPhysical
# diagnostic (does warm-up rescue its latent, or is it obs-only?). NERSC-only (ConvPhysical).
output_dir = ./experiments/particle_experiment/res/poster_headline
csv_name = particle_poster_headline_runs.csv
plot_name = R2_vs_num_noise_poster_headline.png

[Data]
t_max = 2000
train_ratio = 0.7
T = 31
num_blob = 30
orbit_radius = 3.0
trajectory = torus
torus_ratio = 1.618033988749895
torus_r2 = 1.0
omega = 0.05
sigma_blob = 0.1
noise_ar_coeff = 0.8
spatial_bounds = 10.0

[Sweep]
# beta from near-zero (1e-4 ~ the "does latent ignite" diagnostic) up into hard compression.
betas = 1e-4, 1e-3, 1e-2, 1e-1
seeds = 0, 1, 2
num_noise_values = 80
num_blob_values = 30
include_mlp = true
include_conv_spatial = false
include_conv_particle = false
include_mask_uniform_static = false
include_mask_uniform_learned = true
include_mask_pi_static = false
include_mask_pi_init_learned = false
include_conv_physical = true

[Model]
hidden_dim = 64
ydim = 2
beta = 1e-3
critic = concat
estimator_compress = infonce_upper
# Ungated compression rate: bounds the FeatureMaskMLP rate (no-op for MLP/ConvPhysical
# which have no gate) with a consistency loss pulling the gated encoding toward the ungated one.
compress_ungated = true
consistency_weight = 0.05
# Rate warm-up applied UNIFORMLY to all encoders (fair protocol; no-op for encoders that
# don't need it, rescues FeatureMaskMLP-latent, and tests whether it rescues ConvPhysical-latent).
beta_warmup_epochs = 300
beta_ramp_epochs = 200
n_layers = 1
activation = relu
conv_spatial_kernel_size = 4
conv_spatial_stride = 1
conv_spatial_padding = 1
conv_particle_kernel_size = 5
conv_particle_stride = 1
conv_particle_padding = 2
conv_particle_coord_kernel_size = 2
conv_physical_grid_size = 20
conv_physical_spatial_bounds = 3.0
conv_physical_kernel_size = 3
conv_physical_stride = 1
conv_physical_padding = 1

[Training]
epochs = 1000
batch_size = 1024
lr = 2e-4
early_stop = 1000000
conv_epochs = 1000
conv_early_stop = 1000000

[OOM]
oom_retry_enabled = true
oom_batch_size_fallbacks = 1024,512,256,128
oom_max_retries = 4
oom_skip_on_failure = true

[Analysis]
save_filter_viz = false
save_probe_viz = false
enable_tensorboard = true
tensorboard_dir = tensorboard
mask_eval_threshold = 0.6
pi_max_lag = 5
pi_lag_agg = mean
probe_eval_every = 25

[Compute]
use_gpu = true
device = auto
