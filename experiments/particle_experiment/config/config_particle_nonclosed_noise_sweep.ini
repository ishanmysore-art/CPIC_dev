[Paths]
output_dir = ./experiments/particle_experiment/res/nonclosed_noise_sweep
csv_name = particle_nonclosed_noise_sweep_runs.csv
plot_name = R2_vs_num_noise_nonclosed_noise_sweep.png

[Data]
t_max = 2000
train_ratio = 0.7
T = 31
num_blob = 30
# Incommensurate 2-torus (epicyclic rosette): p(t) = R(cos w1 t, sin w1 t) + r(cos w2 t,
# sin w2 t) with w2/w1 = torus_ratio irrational so the coherent orbit never closes.
# orbit_radius = R (primary), torus_r2 = r (epicycle), omega = w1. torus_r2=0 reduces to
# the plain circle. Ratio = phi^2 = phi+1 ~ 2.618 (golden-family, still maximally non-
# closing) chosen over plain golden 1.618 because the FREQUENCY RATIO is what breaks the
# position->velocity linear redundancy: at ratio 1.618 velocity is still ~95% linearly
# predictable from position (weak), at 2.618 it drops to ~80% -> a ~20% diagnostic gap.
# r=1.5 (R=3) spans an annulus radius ~1.5..4.5, well inside spatial_bounds=10.
orbit_radius = 3.0
trajectory = torus
omega = 0.05
torus_ratio = 2.618033988749895
torus_r2 = 1.5
sigma_blob = 0.1
noise_ar_coeff = 0.8
spatial_bounds = 10.0

[Sweep]
# NON-CLOSED trajectory variant (parallel track). Same noise sweep as
# config_particle_noise_sweep.ini but the blob CENTROID follows an incommensurate
# 2-torus (see [Data]) instead of a closed circle. KEY POINT: on a circle velocity is a
# perfect LINEAR image of position (velocity = omega * rotate(position, 90 deg)), so
# linear-probe velocity R2 == position R2 and the velocity panel is redundant. On the
# torus the path self-intersects (a given (x,y) is visited with different velocities), so
# velocity is NOT a linear function of position -> position R2 and velocity R2 DIVERGE,
# making the velocity probe an independent diagnostic and giving the obs>latent puzzle a
# real second axis. BONUS ydim tie-in: pos & vel are both linear in the 4 phase-features
# (cos/sin of each frequency), so decoding velocity needs the latent to disentangle both
# frequencies -> motivates ydim>=4 in the later sweep. Full 3 encoders x latent/obs, 3
# seeds. num_noise=0 = noise-free (blob torus only).
seeds = 0, 1, 2
num_noise_values = 0, 20, 50, 80, 120, 180
include_mlp = true
include_conv_spatial = false
include_conv_particle = false
include_mask_uniform_static = false
include_mask_uniform_learned = true
include_mask_pi_static = false
include_mask_pi_init_learned = false
include_conv_physical = true

[Model]
hidden_dim = 64
# Soft-penalty compression weight: loss = beta*I_compress - beta1*I_predictive.
beta = 1e-3
critic = concat
# Rate estimator: infonce_upper (UPPER bound on the minimized rate I(X;Z)). Off-diagonal
# domination is handled by more InfoNCE samples (larger batch below). A clean
# "vary the data, hold the model" baseline for the metric-vs-num_noise panels.
estimator_compress = infonce_upper
# Ungated compression rate bounds the FeatureMaskMLP gate (no-op for gate-free encoders).
compress_ungated = true
n_layers = 1
activation = relu
conv_spatial_kernel_size = 4
conv_spatial_stride = 1
conv_spatial_padding = 1
conv_particle_kernel_size = 5
conv_particle_stride = 1
conv_particle_padding = 2
conv_particle_coord_kernel_size = 2
conv_physical_grid_size = 20
conv_physical_spatial_bounds = 3.0
conv_physical_kernel_size = 3
conv_physical_stride = 1
conv_physical_padding = 1

[Training]
epochs = 1000
# Larger batch = more InfoNCE negatives (Rui's off-diagonal fix).
batch_size = 1024
lr = 2e-4
early_stop = 1000000
conv_epochs = 1000
conv_early_stop = 1000000

[OOM]
oom_retry_enabled = true
oom_batch_size_fallbacks = 1024,512,256,128
oom_max_retries = 4
oom_skip_on_failure = true

[Analysis]
save_filter_viz = false
save_probe_viz = false
enable_tensorboard = true
tensorboard_dir = tensorboard
mask_eval_threshold = 0.6
pi_max_lag = 5
pi_lag_agg = mean
probe_eval_every = 25

[Compute]
use_gpu = true
device = auto
