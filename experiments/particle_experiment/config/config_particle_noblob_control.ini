[Paths]
output_dir = ./experiments/particle_experiment/res/noblob_control
csv_name = particle_noblob_control_runs.csv
plot_name = R2_vs_num_noise_noblob_control.png

[Data]
# Negative control for the velocity metric. Identical to the main noise sweep
# EXCEPT num_blob = 0: NO particle follows the
# orbit, but the generator still derives the ground-truth centroid from the orbit
# params, so the target stays the SAME moving circle as the main run while the input
# carries ZERO blob signal. A held-out linear probe then cannot beat the mean, so
# position-R2 AND velocity-R2 should collapse to ~0. Because the target still VARIES
# (unlike orbit_radius=0, whose constant target makes R2 degenerate), this is a proper
# signal-ablation control: a high velocity-R2 here would mean the metric is spurious.
t_max = 2000
train_ratio = 0.7
T = 31
num_blob = 0
orbit_radius = 3.0
trajectory = circle
omega = 0.05
sigma_blob = 0.1
noise_ar_coeff = 0.8
spatial_bounds = 10.0

[Sweep]
# Small compression weight (beta=1e-3), giving the encoder the best chance to find
# signal. If velocity-R2 still collapses under this most-favorable setting, the
# control is convincing.
seeds = 0, 1, 2
num_noise_values = 80
include_mlp = false
include_conv_spatial = false
include_conv_particle = false
include_mask_uniform_static = false
include_mask_uniform_learned = true
include_mask_pi_static = false
include_mask_pi_init_learned = false
include_conv_physical = false

[Model]
hidden_dim = 64
beta = 1e-3
critic = concat
estimator_compress = infonce_upper
n_layers = 1
activation = relu

[Training]
epochs = 1000
batch_size = 256
lr = 2e-4
early_stop = 1000000
conv_epochs = 1000
conv_early_stop = 1000000

[OOM]
oom_retry_enabled = true
oom_batch_size_fallbacks = 256,128,64,32
oom_max_retries = 4
oom_skip_on_failure = true

[Analysis]
save_filter_viz = false
# Probe-result figures for the control: the position-orbit overlay + velocity field
# should show the predicted orbit collapsing to noise (no blob signal to recover),
# the compelling visual counterpart to the ~0 R2 numbers. -> res/noblob_control/probe_viz/.
save_probe_viz = true
enable_tensorboard = true
tensorboard_dir = tensorboard
mask_eval_threshold = 0.6
pi_max_lag = 5
pi_lag_agg = mean
probe_eval_every = 25

[Compute]
use_gpu = true
device = auto
