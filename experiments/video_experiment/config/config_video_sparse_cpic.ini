[User]
# .npz (key "frames") or .npy (T,H,W,C); paths relative to experiments/video_experiment/ or repo root
video_path = data/dryad_chicago_natural_movies/MultipleMoviesStim_1_tree.npz
saved_root = res/video_sparse_cpic

[Data]
# Optional caps (empty = use all frames)
max_frames =
# Temporal subsampling: keep every k-th frame after max_frames (empty or 1 = keep all)
frame_stride = 
resize_height = 172
# resize_height = 86
resize_width = 172
# resize_width = 86
# Scale uint8 frames to [0, 1] float32
normalize = True

[Hyperparameters]
beta = 1e-3
# Flattened frame dimension H*W*C (must match data after optional resize)
xdim =  
ydim = 10
T = 4
hidden_dim = 64
estimator_compress = infonce_upper
estimator_predictive = infonce_lower
critic = concat
baseline = constant
deterministic = False
predictive_space = latent
gamma = 0.1

[Training]
num_epochs = 1000
num_early_stop = 20
batch_size = 64
do_dca_init = False
decoder_loss_warmup = True
# Number of epochs for decoder warmup (empty = warm up across all epochs).
decoder_loss_warmup_epochs = 100
device = cuda:0
lr = 0.001
