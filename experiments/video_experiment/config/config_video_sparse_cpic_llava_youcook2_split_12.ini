# Command to run sparse CPIC on LLaVA-Video-178K youcook2 clip (240 frames, 720x1280); processed by process_llava_video_178k.py
# uv run python experiments/video_experiment/run_sparse_cpic.py --config experiments/video_experiment/config/config_video_sparse_cpic_llava_youcook2_split_12.ini

[User]
# LLaVA-Video-178K youcook2 clip (240 frames, 720x1280); processed by process_llava_video_178k.py
video_path = data/llava_video_178k/processed/videos/academic_source/youcook2/121/sZ2NyyKVf7A/split_12.npz
saved_root = res/video_sparse_cpic/llava_youcook2_split_12

[Data]
# Optional caps (empty = use all frames)
max_frames =
# Temporal subsampling: keep every k-th frame after max_frames (empty or 1 = keep all)
frame_stride =
resize_height = 36
resize_width = 64
# Scale uint8 frames to [0, 1] float32
normalize = True

[Hyperparameters]
beta = 1e-3
# Flattened frame dimension H*W*C (must match data after optional resize); auto-set if empty
xdim =
ydim = 10
T = 4
hidden_dim = 64
estimator_compress = infonce_upper
estimator_predictive = infonce_lower
critic = concat
baseline = constant
deterministic = False
predictive_space = latent
gamma = 0.1

[Training]
num_epochs = 1000
num_early_stop = 500
batch_size = 64
do_dca_init = False
decoder_loss_warmup = True
# Number of epochs for decoder warmup (empty = warm up across all epochs).
decoder_loss_warmup_epochs = 100
device = cuda:0
lr = 0.001
