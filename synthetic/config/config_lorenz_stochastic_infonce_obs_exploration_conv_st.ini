[User]
RESULTS_FILENAME = data/lorenz/lorenz_exploration.hdf5
saved_root = res/lorenz_stochastic_infonce_obs_exploration_conv_st

[Hyperparameters]
beta = 1e-3
xdim = 30
ydim = 3
T = 4
hidden_dim = 64
# mi_params = {'estimator_compress': "vub", "estimator_predictive": "nwj", "critic": "concat", "baseline": "constant"}
# mi_params = {'estimator_compress': "vub", "estimator_predictive": "mine", "critic": "concat",
#              "baseline": "constant"}
# mi_params = {'estimator_compress': "vub", "estimator_predictive": "tuba", "critic": "concat",
#              "baseline": "unnormalized"}
# mi_params = {'estimator_compress': "vub", "estimator_predictive": "infonce_lower", "critic": "concat",
#              "baseline": "constant"}
estimator_compress = infonce_upper
estimator_predictive = infonce_lower
critic = concat
baseline = constant
deterministic = False
predictive_space = observation

# Encoder parameters (spatiotemporal 2D conv over features and time)
encoder_type = conv_spatiotemporal
linear_encoding = False
n_layers = 0
activation = relu
conv_kernel_size = 3
conv_stride = 1
conv_padding = 1

[Training]
num_epochs = 100
num_early_stop = 0
batch_size = 1024
num_vis = 500
do_dca_init = False
do_vis_latent_trials = False
device = cuda:0
lr = 0.001

